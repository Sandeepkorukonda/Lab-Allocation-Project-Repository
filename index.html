<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab Allocation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Lab Allocation System</h1>
    </header>

    <main>
      <!-- CSV Upload Section -->
      <section id="upload-section">
        <h2>Upload Lab Data</h2>
        <input type="file" id="csvFile" accept=".csv" />
        <button id="uploadBtn" onclick="loadCSV()">Upload CSV</button>
      </section>

      <!-- Input Section -->
      <section id="input-section">
        <h2>Allocate Students</h2>
        <label for="numStudents">Number of Students:</label>
        <input type="number" id="numStudents" placeholder="Enter number of students" />

        <label for="startTime">Start Time:</label>
        <select id="startTime">
          <option value="">--Select Start Time--</option>
          <option value="8">8:00</option>
          <option value="10">10:00</option>
          <option value="12">12:00</option>
          <option value="14">14:00</option>
          <option value="16">16:00</option>
          <option value="18">18:00</option>
        </select>

        <label for="endTime">End Time:</label>
        <select id="endTime">
          <option value="">--Select End Time--</option>
          <option value="10">10:00</option>
          <option value="12">12:00</option>
          <option value="14">14:00</option>
          <option value="16">16:00</option>
          <option value="18">18:00</option>
          <option value="20">20:00</option>
        </select>

        <button onclick="allocateStudents()">Allocate</button>
      </section>

      <!-- Output Section -->
      <section id="result-section">
        <h2>Lab Allocation Results</h2>
        <div id="result"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
